<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大学">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>大学</title>
<style>
:root{
  --bg:#0d1410;--bg2:#172019;--surface:#1e2921;--surface2:#26332a;
  --paper:#efe4cf;--ink:#efe8dc;--muted:#9fa99d;--orange:#d99a7c;
  --orange2:#edb89d;--line:rgba(217,154,124,.20);--shadow:0 18px 48px rgba(0,0,0,.30)
}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(110,142,118,.16),transparent 28rem),radial-gradient(circle at 95% 18%,rgba(217,154,124,.11),transparent 24rem),linear-gradient(180deg,var(--bg2),var(--bg))}
.page{width:min(1220px,100%);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}.mark{width:56px;height:56px;display:grid;place-items:center;border-radius:17px;border:1px solid rgba(217,154,124,.46);background:rgba(103,132,109,.18);color:var(--orange2);font-size:29px;font-weight:800}
h1{margin:0;color:#f1e3d2;font-size:clamp(28px,4vw,42px)}.sub{margin:5px 0 0;color:var(--muted);font-size:12px}.back{color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap}.back:hover{color:var(--orange2)}
.about,.notice{margin-bottom:14px;padding:16px 17px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(32,45,36,.94),rgba(20,29,23,.94))}
.about-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 18px}.about-item{min-width:0}.about-item b{display:block;margin-bottom:3px;color:var(--orange2);font-size:11px}.about-item span,.notice{color:#d0c1b4;font-size:12px;line-height:1.7}.about-summary{grid-column:1/-1;padding-top:4px}.notice{margin-bottom:18px}.notice b{color:var(--orange2)}
.reader{display:grid;grid-template-columns:minmax(230px,292px) minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(18,27,21,.88);box-shadow:var(--shadow)}
.search{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#101711;color:var(--ink);font:inherit;outline:none}.search:focus{border-color:rgba(217,154,124,.52)}
.toc-list{display:flex;flex-direction:column;gap:5px;max-height:68vh;overflow:auto;padding-right:3px;scrollbar-width:thin;scrollbar-color:rgba(217,154,124,.24) transparent}
.group-label{margin:11px 8px 3px;color:#9eaf9e;font-size:10px;letter-spacing:.12em}.group-label:first-child{margin-top:2px}
.toc-btn{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#adb7ad;font:inherit;font-size:12px;cursor:pointer}
.toc-btn span{color:#748276;font-size:10px;min-width:24px}.toc-btn:hover,.toc-btn.active{border-color:var(--line);background:#253229;color:#efe8dc}
.article{min-width:0;padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--surface2),var(--surface));box-shadow:var(--shadow)}
.article-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.kicker{color:#d99a7c;font-size:10px;letter-spacing:.12em}.article h2{margin:5px 0 0;color:#f1e3d2;font-size:29px}.progress{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#a9b0a8;font-size:11px;white-space:nowrap}
.group-summary{margin:-6px 0 17px;padding:10px 12px;border-left:2px solid rgba(217,154,124,.5);color:#aeb8ad;font-size:11px;line-height:1.7}
.status{display:inline-flex;margin:0 0 14px;padding:6px 9px;border:1px solid rgba(217,154,124,.28);border-radius:999px;color:#e0a78b;font-size:10px;background:rgba(217,154,124,.08)}
.original{margin:0 0 20px;padding:20px;border:1px solid rgba(217,154,124,.22);border-radius:16px;background:var(--paper);color:#344039;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}.original p{margin:0;font-size:clamp(18px,2.35vw,25px);line-height:1.95;letter-spacing:.025em}.original p+p{margin-top:7px}
.block{padding-top:16px;margin-top:16px;border-top:1px solid rgba(217,154,124,.14)}.block b{display:block;margin-bottom:6px;color:var(--orange2);font-size:12px}.block p{margin:0;color:#d0c4b8;font-size:13px;line-height:1.85}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.term{padding:10px 11px;border:1px solid rgba(217,154,124,.13);border-radius:11px;background:rgba(8,14,10,.22)}.term strong{display:block;margin-bottom:4px;color:#e6ddd2;font-size:12px}.term span{color:#adb5ad;font-size:11px;line-height:1.65}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:17px;border-top:1px solid rgba(217,154,124,.15)}.nav button{min-height:42px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:#182119;color:#d8d7cf;font:inherit;font-size:12px;cursor:pointer}.nav button:hover:not(:disabled){border-color:rgba(217,154,124,.5);color:#f4e7d8}.nav button:disabled{opacity:.32;cursor:default}
footer{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:38px;padding-top:18px;border-top:1px solid var(--line);color:#87958a;font-size:11px}footer a{color:inherit;text-decoration:none}footer a:hover{color:var(--orange2)}.empty{padding:12px;color:#839087;font-size:11px}
@media(max-width:820px){.reader{grid-template-columns:1fr}.toc{position:static}.toc-list{max-height:none}.group-label{margin-top:14px}}
@media(max-width:560px){.page{padding-left:13px;padding-right:13px}.mark{width:50px;height:50px;font-size:27px}.brand h1{font-size:28px}.back{font-size:11px}.article{padding:17px}.original{padding:15px}.original p{font-size:18px;line-height:1.9}.terms{grid-template-columns:1fr}.about-grid{grid-template-columns:1fr}.about-summary{grid-column:auto}}
</style>
</head>
<body>
<main class="page">
<header><div class="brand"><div class="mark" aria-hidden="true">大</div><div><h1>大学</h1><p class="sub">原文 · 白话解释 · 字词小解 · 思想小记</p></div></div><a class="back" href="https://noagrp.github.io/zhong/">返回 中</a></header>
<section class="about" id="bookAbout" aria-label="书籍简介"></section>
<div class="notice" id="sourceNotice"></div>
<div class="reader">
  <aside class="toc"><input class="search" id="search" type="search" placeholder="搜索原文、概念、章节或字词"><div class="toc-list" id="tocList"></div></aside>
  <article class="article" id="article" aria-live="polite"></article>
</div>
<footer><a href="https://noagrp.github.io/home/">noagrp home</a><span>·</span><a href="https://noagrp.github.io/zhong/">中</a></footer>
</main>
<script src="./src/daxue-engine.js"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id);
 try{
  const engine=await loadDaxueEngine('./data/daxue.json?v=20261018-1');
  const meta=engine.getMeta(),info=meta.bookInfo||{};
  const rows=[["书名",info.title],["文本 / 编次",info.authorship],["时代",info.period],["类别",info.category],["结构",info.structure]].filter(x=>x[1]);
  $("bookAbout").innerHTML='<div class="about-grid">'+rows.map(x=>'<div class="about-item"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+(info.summary?'<div class="about-item about-summary"><b>简介</b><span>'+info.summary+'</span></div>':'')+'</div>';
  $("sourceNotice").innerHTML='<b>版本说明</b><br>'+meta.sourceNote+'<br><br><b>阅读原则</b><br>'+meta.readingNote;
  const all=engine.list();let selected=all[0];
  function renderToc(list=all){
    if(!list.length){$("tocList").innerHTML='<div class="empty">没有找到相关内容。</div>';return;}
    let last=null,html='';
    list.forEach(item=>{const g=engine.getGroup(item.group)||{name:item.group};if(g.name!==last){html+='<div class="group-label">'+g.name+'</div>';last=g.name;}const i=engine.indexOf(item.id)+1;html+='<button class="toc-btn'+(selected&&selected.id===item.id?' active':'')+'" type="button" data-id="'+item.id+'"><span>'+String(i).padStart(2,"0")+'</span>'+item.title+'</button>';});
    $("tocList").innerHTML=html;$("tocList").querySelectorAll(".toc-btn").forEach(btn=>btn.addEventListener("click",()=>select(btn.dataset.id,true)));
  }
  function renderArticle(item){
    const idx=engine.indexOf(item.id),prev=engine.getPrevious(item.id),next=engine.getNext(item.id),g=engine.getGroup(item.group)||{};
    $("article").innerHTML='<div class="article-head"><div><div class="kicker">大学 · '+(g.name||'')+' · 第 '+(idx+1)+' 段</div><h2>'+item.title+'</h2></div><div class="progress">'+(idx+1)+' / '+all.length+'</div></div>'+
      (g.summary?'<div class="group-summary">'+g.summary+'</div>':'')+
      (item.textStatus?'<div class="status">'+item.textStatus+'</div>':'')+
      '<div class="original">'+item.original.map(x=>'<p>'+x+'</p>').join("")+'</div>'+
      '<div class="block"><b>白话解释</b><p>'+item.explanation+'</p></div>'+
      (item.terms&&item.terms.length?'<div class="block"><b>字词小解</b><div class="terms">'+item.terms.map(t=>'<div class="term"><strong>'+t[0]+'</strong><span>'+t[1]+'</span></div>').join("")+'</div></div>':'')+
      (item.note?'<div class="block"><b>思想小记 / 现代提示</b><p>'+item.note+'</p></div>':'')+
      '<div class="nav"><button id="prevBtn" type="button" '+(!prev?'disabled':'')+'>← 上一段</button><button id="nextBtn" type="button" '+(!next?'disabled':'')+'>下一段 →</button></div>';
    $("prevBtn").addEventListener("click",()=>prev&&select(prev.id,true));$("nextBtn").addEventListener("click",()=>next&&select(next.id,true));
  }
  function select(id,scroll){const item=engine.get(id);if(!item)return;selected=item;renderArticle(item);renderToc(engine.search($("search").value));if(scroll&&matchMedia("(max-width:820px)").matches)$("article").scrollIntoView({behavior:"smooth",block:"start"});}
  $("search").addEventListener("input",e=>renderToc(engine.search(e.target.value)));renderToc();renderArticle(selected);if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
 }catch(e){$("article").innerHTML='<div class="empty">资料载入失败，请刷新页面再试。</div>';}
})();
</script>
</body>
</html>
